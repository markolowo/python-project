# =====================================================================
# .github/workflows/tests.yml — CI: АВТОМАТИЧЕСКИЕ ТЕСТЫ НА GITHUB (критерий 4)
# ---------------------------------------------------------------------
# GitHub Actions — бесплатные «виртуальные компьютеры» GitHub. При каждом push в main
# GitHub сам скачивает код, ставит Python и библиотеки и запускает pytest.
# Результат — во вкладке Actions репозитория (зелёная галочка или красный крестик у коммита)
# и на значке Tests в README.
# Тестам не нужны PostgreSQL и Redis: они используют SQLite и Celery в памяти (tests/conftest.py).
# =====================================================================

name: Tests                     # название проверки

on:                             # КОГДА запускать
  push:
    branches: [main]            # при каждом push в ветку main (требование задания)
  pull_request:
    branches: [main]            # и при pull request в main — проверить до слияния

jobs:
  pytest:                       # одна задача (job) с именем pytest
    runs-on: ubuntu-latest      # на чистой виртуальной машине Ubuntu

    steps:                      # шаги по порядку
      - name: Получить код
        uses: actions/checkout@v4          # готовое действие: скачать код репозитория

      - name: Установить Python
        uses: actions/setup-python@v5      # готовое действие: поставить нужную версию Python
        with:
          python-version: "3.14"
          cache: pip                       # кэшировать скачанные пакеты — следующие запуски быстрее

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Запустить тесты
        run: pytest -v                     # если хоть один тест упадёт — весь запуск будет красным
