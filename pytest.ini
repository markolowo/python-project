# pytest.ini: pythonpath = . tests — чтобы тесты видели пакет app и conftest;
# filterwarnings — скрыты 2 предупреждения библиотек (Starlette про httpx2, slowapi про функцию asyncio,
#   устаревшую в Python 3.14). На работу не влияют.
[pytest]
pythonpath = . tests
testpaths = tests
filterwarnings =
    ignore:Using .httpx. with .starlette.testclient. is deprecated
    ignore:.asyncio.iscoroutinefunction. is deprecated:DeprecationWarning
